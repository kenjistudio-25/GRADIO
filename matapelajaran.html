<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#0f2233;--muted:#4d6a80;--accent:#3d9be0;--green:#28c840;--orange:#ff9f0a;--red:#ff453a;--purple:#af52de;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#97D7FF 0%,#c3e6ff 38%,#e3f3ff 70%,#fdf1d0 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:#fff;border-bottom:.5px solid var(--line);box-shadow:0 1px 8px rgba(30,30,80,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sch-logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:#04150d;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.sch-logo svg{width:20px;height:20px}
.sch-logo img{width:100%;height:100%;object-fit:contain}
.sch-name{display:block;min-width:0;line-height:1.2}
.sch-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-name small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sch-name small{display:none}.sch-name b{font-size:13px}}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--track)}
.acct div{text-align:right;line-height:1.2}
.acct b{display:block;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11px;color:var(--muted)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(160deg,#b9e5ff,#6fc2f6);color:#0b2a42;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
.wrap{max-width:none;margin:0;padding:22px min(150px,12vw)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.025em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}

/* Sticky footer dock — gaya dock layar utama ponsel (melayang, kaca buram, ikon squircle) */
.dock{position:fixed!important;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
html,body{overflow-x:hidden}
.dock nav{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 22px;border-radius:34px;
  background:rgba(255,255,255,.34);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,60,100,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.dock nav .d{display:grid;place-items:center;width:auto;padding:0;border-radius:15px;font-size:0;line-height:0;background:none;transition:transform .2s}
.dock nav .d:hover{background:none;transform:translateY(-6px) scale(1.1)}
.dock nav .d:active{transform:scale(.94)}
.dock nav .d .ic{width:56px;height:56px;border-radius:15px;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.dock nav .d .ic svg{width:28px;height:28px}
.dock nav .d{position:relative}
/* Tooltip nama menu (teks putih, latar hitam) */
.dock nav .d[data-tip]::after,.dock nav .d[data-tip]::before{position:absolute;left:50%;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s}
.dock nav .d[data-tip]::after{content:attr(data-tip);bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:6px 11px;border-radius:8px;background:#000;color:#fff;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.dock nav .d[data-tip]::before{content:"";bottom:calc(100% + 7px);transform:translate(-50%,4px);border-style:solid;border-width:5px 5px 0;border-color:#000 transparent transparent}
.dock nav .d[data-tip]:focus-visible::after,.dock nav .d[data-tip]:focus-visible::before{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media (hover:hover){.dock nav .d[data-tip]:hover::after,.dock nav .d[data-tip]:hover::before{opacity:1;visibility:visible;transform:translate(-50%,0)}}
@media (max-width:520px){.dock nav{gap:22px;padding:9px 18px;border-radius:30px}.dock nav .d .ic{width:50px;height:50px;border-radius:14px}.dock nav .d .ic svg{width:25px;height:25px}}
.d{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;padding:8px 6px;border-radius:16px;font-size:12px;font-weight:600;line-height:1.2;text-align:center;transition:background .15s,transform .15s}
.d:hover{background:var(--track);transform:translateY(-3px)}
.d .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.d .ic svg{width:21px;height:21px}



/* Halaman Mata Pelajaran */
.tw{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;background:rgba(255,255,255,.7);border-bottom:.5px solid var(--line)}
td{padding:12px 14px;border-bottom:.5px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(224,248,199,.55)}
td.id{width:130px}
td.id b{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#1f6fa8;background:rgba(151,215,255,.25);padding:3px 10px;border-radius:99px}
td.nm{font-weight:600;overflow-wrap:anywhere}
td.gr{overflow-wrap:anywhere;color:var(--muted)}td.gr.on{color:inherit}
td.ac,th.ac{width:96px;text-align:right;white-space:nowrap}
.ib{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--track);color:var(--text)}
.ib.del:hover{background:rgba(255,69,58,.14);color:var(--red)}
.ib svg{width:17px;height:17px}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:14px}
dialog#fm{margin:auto;border:0;padding:0;width:min(440px,94vw);border-radius:22px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--shadow);color:var(--text)}
dialog#fm::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mf{padding:20px 22px 22px;display:grid;gap:14px}
.mf h2{font-size:20px;letter-spacing:-.01em}
.mf label{font-size:13px;font-weight:600;display:grid;gap:5px}
.mf input,.mf select{font:inherit;font-weight:400;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--text);min-width:0}
.mf input:focus,.mf select:focus{outline:3px solid var(--accent);outline-offset:1px}
.mf input[readonly]{opacity:.65}
.mm{font-size:13px;min-height:18px;color:var(--red)}
.mm.ok{color:#1fa23c}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:12px;font-weight:700}
.btn.p{color:#0b2a42;background:linear-gradient(180deg,#b9e5ff,#6fc2f6);box-shadow:0 4px 12px rgba(74,166,230,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.g{background:var(--track)}
.btn:disabled{opacity:.6;cursor:wait}
@media (max-width:520px){.acct div{display:none}.acct{padding:3px}.wrap{padding:16px 10px}.nav{padding-left:10px;padding-right:10px}td.id{width:auto}th,td{padding:10px}}
/* ===== Transisi buka/tutup halaman (halus, gaya macOS: muncul dari tombol) ===== */
@view-transition{navigation:auto}
.nav{view-transition-name:pt-nav}
.dock nav{view-transition-name:pt-dock}
::view-transition-group(*){animation-duration:.32s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(root){animation:ptOut .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:ptIn .36s cubic-bezier(.22,1,.36,1) both}
@keyframes ptOut{to{opacity:0;transform:scale(.985)}}
@keyframes ptIn{from{opacity:0;transform:translateY(14px) scale(.992)}}
/* cadangan untuk peramban tanpa View Transitions lintas-halaman */
@keyframes ptFade{from{opacity:0}}
@keyframes ptRise{from{opacity:0;transform:translateY(12px)}}
@keyframes ptZoom{from{opacity:0;transform:scale(.12)}}
.pt-fb body{animation:ptFade .3s ease both}
.pt-fb .wrap{animation:ptRise .38s cubic-bezier(.22,1,.36,1) backwards}
.pt-fb.pt-out body{opacity:0;transition:opacity .2s ease}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .pt-fb body,.pt-fb .wrap{animation:none!important}
  .pt-fb.pt-out body{transition:none}
}

/* Modal Import dari Simpedik */
dialog#imp{margin:auto;border:0;padding:0;width:min(720px,95vw);max-height:88vh;border-radius:22px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--shadow);color:var(--text);overflow:hidden}
dialog#imp[open]{display:block}
dialog#imp::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.imf{display:flex;flex-direction:column;gap:12px;padding:20px 22px 22px;max-height:88vh}
.imh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.imh h2{font-size:20px;letter-spacing:-.01em}
.imsub{font-size:13px;color:var(--muted);margin-top:2px}
.imx{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--track);color:var(--muted)}
.imx svg{width:16px;height:16px}
#impQ{font:inherit;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--text);min-width:0}
#impQ:focus{outline:3px solid var(--accent);outline-offset:1px}
.imtw{flex:1;min-height:120px;overflow:auto;border-radius:12px;border:.5px solid var(--line);background:rgba(255,255,255,.7)}
.imtw table{width:100%;border-collapse:collapse;font-size:13.5px}
.imtw th.ck,.imtw td.ck{width:1%;padding-right:4px}
.imtw input[type=checkbox]{width:17px;height:17px;accent-color:#6d28d9;cursor:pointer}
.imtw tr.has td{opacity:.55}
.imtw tr.has input{cursor:not-allowed}
.imtw tbody tr[data-i]{cursor:pointer}
.bdg{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--muted);vertical-align:1px}
#impMsg{margin:0}

<script>
/* Transisi halaman: halaman baru "keluar" dari tombol yang diklik (seperti membuka jendela dari Dock macOS);
   tombol Beranda menutupnya kembali mengecil ke tombol. Cadangan fade untuk peramban tanpa View Transitions. */
(function(){
  var KEY='pt-origin',h=document.documentElement,
      reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,
      vt=typeof PageRevealEvent!=='undefined';
  function take(){
    var o=null;
    try{o=JSON.parse(sessionStorage.getItem(KEY)||'null');sessionStorage.removeItem(KEY);}catch(_){}
    return o&&Date.now()-o.t<5000?o:null;
  }
  if(!vt)h.classList.add('pt-fb');

  /* simpan titik asal (pusat ikon yang diklik) lalu, bila perlu, jalankan fade-out cadangan */
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||(a.target&&a.target!=='_self')||a.hasAttribute('download'))return;
    var u;try{u=new URL(a.href,location.href);}catch(_){return;}
    if(u.origin!==location.origin||(u.pathname===location.pathname&&u.search===location.search))return;
    var el=a.querySelector('.ic,.ai')||a,r=el.getBoundingClientRect();
    try{sessionStorage.setItem(KEY,JSON.stringify({x:r.left+r.width/2,y:r.top+r.height/2,close:a.id==='btnHome',t:Date.now()}));}catch(_){}
    if(vt||reduce)return;
    e.preventDefault();h.classList.add('pt-out');
    setTimeout(function(){location.href=u.href;},200);
  });
  window.addEventListener('pageshow',function(e){if(e.persisted)h.classList.remove('pt-out');});

  if(vt){
    addEventListener('pagereveal',function(e){
      var o=take();
      if(!o||!e.viewTransition||reduce)return;
      e.viewTransition.ready.then(function(){
        var org=o.x+'px '+o.y+'px',nb={mixBlendMode:'normal'},
            opt=function(pe,d){return {pseudoElement:pe,duration:d,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'};};
        function kf(a,b){return [Object.assign({},nb,a),Object.assign({},nb,b)];}
        if(o.close){      /* tutup: halaman lama mengecil ke tombol, halaman tujuan terlihat di belakangnya */
          h.animate(kf({transform:'scale(1)',opacity:1,zIndex:3,transformOrigin:org},
                       {transform:'scale(.06)',opacity:0,zIndex:3,transformOrigin:org}),opt('::view-transition-old(root)',400));
          h.animate(kf({transform:'scale(1.04)',opacity:.55},{transform:'scale(1)',opacity:1}),opt('::view-transition-new(root)',400));
        }else{            /* buka: halaman baru membesar dari tombol, halaman lama sedikit mundur */
          h.animate(kf({transform:'scale(.05)',opacity:0,borderRadius:'48px',zIndex:3,transformOrigin:org},
                       {transform:'scale(1)',opacity:1,borderRadius:'0px',zIndex:3,transformOrigin:org}),opt('::view-transition-new(root)',480));
          h.animate(kf({transform:'scale(1)',opacity:1},{transform:'scale(.96)',opacity:1}),opt('::view-transition-old(root)',480));
        }
      }).catch(function(){});
    });
  }else{
    /* cadangan: lembar isi membesar dari titik tombol */
    document.addEventListener('DOMContentLoaded',function(){
      var o=take(),w=document.querySelector('.wrap');
      if(!o||o.close||reduce||!w)return;
      var r=w.getBoundingClientRect();
      w.style.transformOrigin=(o.x-r.left)+'px '+(o.y-r.top)+'px';
      w.style.animation='ptZoom .46s cubic-bezier(.22,1,.36,1) backwards';
    });
  }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var db=window.supabase.createClient('https://vvlngdwghdhrrnpczier.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2bG5nZHdnaGRocnJucGN6aWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDI1MzgsImV4cCI6MjEwNzk3ODUzOH0.kV3y6rUu0NKbV451dvD4SkeZRJtuLNzwoA81tUY8jiA');
  var ICO={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>',
    del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'};
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function ini(n){return n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}

  /* akun & sekolah (sama dengan adminguru.html) */
  try{var s=JSON.parse(sessionStorage.getItem('madani_session')||'null');
    if(s&&s.nama){$('acctName').textContent=s.nama;$('acctAv').textContent=ini(s.nama)}}catch(_){}
  (async function(){try{
    var r=await db.from('profil').select('nama_guru,foto_url,logo_url,nama_sekolah').order('id',{ascending:true}).limit(1).maybeSingle();
    if(r.error||!r.data)return;var d=r.data;
    if(d.nama_guru){$('acctName').textContent=d.nama_guru;if(!d.foto_url)$('acctAv').textContent=ini(d.nama_guru)}
    if(d.foto_url){var im=document.createElement('img');im.alt='';im.src=d.foto_url;$('acctAv').textContent='';$('acctAv').appendChild(im)}
    if(d.logo_url)$('navLogo').src=d.logo_url;
    if(d.nama_sekolah)$('navTitle').textContent=d.nama_sekolah;
  }catch(_){}})();
  /* daftar Guru Yang Mengajar: ditarik dari tabel profil (halaman dataguruadmin.html) */
  var guru=[],guruOk=false;
  function isiGuru(pilih){
    var sel=$('fGr'),v=pilih||'',list=guru.slice();
    if(v&&list.indexOf(v)<0)list.push(v);   /* nama lama yang sudah tidak ada di data guru tetap tampil */
    sel.innerHTML='<option value="">'+(guruOk?(list.length?'— Pilih guru —':'Belum ada data guru'):'Gagal memuat data guru')+'</option>'+
      list.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('');
    sel.value=v;
  }
  async function muatGuru(){
    try{
      var r=await db.from('profil').select('nama_guru');
      if(r.error)throw r.error;
      var seen={};
      guru=(r.data||[]).map(function(x){return (x.nama_guru||'').trim().replace(/\s+/g,' ')})
        .filter(function(n){if(!n||seen[n])return false;seen[n]=1;return true})
        .sort(function(a,b){return a.localeCompare(b,'id')});
      guruOk=true;
    }catch(e){guruOk=false}
    isiGuru($('fGr').value);
  }

  /* ---------- Tabel mata_pelajaran (id, nama_mapel, guru_pengajar) ---------- */
  var dlg=$('fm'),busy=false,edit=null,ada={};
  function acak(){var n=Math.floor(Math.random()*10000);return 'MP-'+('000'+n).slice(-4)}
  function idBaru(){var id,i=0;do{id=acak();i++}while(ada[id]&&i<200);return id}
  function msg(t,ok){var e=$('fMsg');e.className='mm'+(ok?' ok':'');e.textContent=t||''}
  async function muat(){
    var tb=$('tb');
    try{
      var r=await db.from('mata_pelajaran').select('id,nama_mapel,guru_pengajar');
      if(r.error)throw r.error;
      var d=(r.data||[]).sort(function(a,b){return String(a.id).localeCompare(String(b.id),'id',{numeric:true})});
      ada={};d.forEach(function(x){ada[x.id]=1});
      $('cnt').textContent=d.length+' mapel';
      tb.innerHTML=d.length?d.map(function(x){
        return '<tr data-id="'+esc(x.id)+'" data-nm="'+esc(x.nama_mapel)+'" data-gr="'+esc(x.guru_pengajar)+'"><td class="id"><b>'+esc(x.id)+'</b></td><td class="nm">'+esc(x.nama_mapel)+'</td><td class="gr'+(x.guru_pengajar?' on':'')+'">'+(x.guru_pengajar?esc(x.guru_pengajar):'Belum diatur')+'</td><td class="ac"><button class="ib ed" type="button" aria-label="Ubah '+esc(x.nama_mapel)+'">'+ICO.edit+'</button><button class="ib del" type="button" aria-label="Hapus '+esc(x.nama_mapel)+'">'+ICO.del+'</button></td></tr>';
      }).join(''):'<tr><td colspan="4" class="empty">Belum ada mata pelajaran. Klik Tambah Mapel untuk memulai.</td></tr>';
    }catch(e){
      $('cnt').textContent='Gagal';
      tb.innerHTML='<tr><td colspan="4" class="empty">Gagal memuat: '+esc(e.message||e)+'</td></tr>';
    }
  }
  function buka(id,nm,gr){
    edit=id||null;msg('');
    $('fmT').textContent=edit?'Ubah Mata Pelajaran':'Tambah Mata Pelajaran';
    $('fId').value=edit?id:idBaru();$('fNm').value=nm||'';isiGuru(gr||'');if(!guruOk)muatGuru();
    dlg.showModal();$('fNm').focus();
  }
  $('btnAdd').addEventListener('click',function(){buka()});
  $('fX').addEventListener('click',function(){dlg.close()});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  $('tb').addEventListener('click',async function(ev){
    var tr=ev.target.closest('tr[data-id]');if(!tr)return;
    var id=tr.getAttribute('data-id'),nm=tr.getAttribute('data-nm'),gr=tr.getAttribute('data-gr');
    if(ev.target.closest('.ed')){buka(id,nm,gr);return}
    if(ev.target.closest('.del')){
      if(!confirm('Hapus mata pelajaran '+nm+'?'))return;
      var r=await db.from('mata_pelajaran').delete().eq('id',id);
      if(r.error){alert('Gagal menghapus: '+r.error.message);return}
      muat();
    }
  });
  $('ff').addEventListener('submit',async function(ev){
    ev.preventDefault();if(busy)return;
    var nm=$('fNm').value.trim().replace(/\s+/g,' '),gr=$('fGr').value.trim().replace(/\s+/g,' ');
    if(!nm){msg('Isi Nama Mapel.');return}
    if(!gr){msg('Pilih Guru Yang Mengajar.');return}
    busy=true;$('fS').disabled=true;$('fS').textContent='Menyimpan…';
    try{
      var r;
      if(edit)r=await db.from('mata_pelajaran').update({nama_mapel:nm,guru_pengajar:gr}).eq('id',edit);
      else{
        var id=$('fId').value||idBaru();
        for(var t=0;t<8;t++){
          r=await db.from('mata_pelajaran').insert({id:id,nama_mapel:nm,guru_pengajar:gr});
          if(!r.error||r.error.code!=='23505')break;
          ada[id]=1;id=idBaru();$('fId').value=id;   /* Id bentrok: buat Id baru */
        }
      }
      if(r.error)throw r.error;
      dlg.close();muat();
    }catch(e){msg('Gagal menyimpan: '+(e.message||e))}
    busy=false;$('fS').disabled=false;$('fS').textContent='Simpan';
  });

  /* ---------- Import dari Simpedik (datamapel.html: tabel matapelajaran) ---------- */
  var imp=$('imp'),spRows=[],spSel={},spBusy=false,spDb=null;
  var SP_URL='https://ctbskvysuqecnaopqlam.supabase.co',SP_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0YnNrdnlzdXFlY25hb3BxbGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NTAwODksImV4cCI6MjA4NjUyNjA4OX0.npr4SV6s8XFxXek0R0jNvdhlnIZrdTqrNvWGYVtMAcY';
  function spClient(){if(!spDb)spDb=window.supabase.createClient(SP_URL,SP_KEY);return spDb}
  function nrm(t){return String(t==null?'':t).trim().replace(/\s+/g,' ')}
  function key(nm,gr){return nrm(nm).toLowerCase()+'|'+nrm(gr).toLowerCase()}
  function impMsg(t,ok){var e=$('impMsg');e.className='mm'+(ok?' ok':'');e.textContent=t||''}
  function spVisible(){
    var q=nrm($('impQ').value).toLowerCase();
    return spRows.filter(function(r){return !q||(r.kode+' '+r.nama+' '+r.guru).toLowerCase().indexOf(q)>-1});
  }
  function spCount(){
    var n=Object.keys(spSel).length;
    $('impGo').disabled=spBusy||!n;
    $('impGo').textContent=n?'Import '+n+' mapel':'Import';
    var v=spVisible().filter(function(r){return !r.has});
    $('impAll').checked=!!v.length&&v.every(function(r){return spSel[r.i]});
    $('impAll').disabled=!v.length;
  }
  function spRender(){
    var v=spVisible(),b=$('impB');
    if(!v.length){b.innerHTML='<tr><td colspan="4" class="empty">'+(spRows.length?'Tidak ada hasil.':'Belum ada data mata pelajaran di Simpedik.')+'</td></tr>';spCount();return}
    b.innerHTML=v.map(function(r){
      return '<tr data-i="'+r.i+'"'+(r.has?' class="has"':'')+'><td class="ck"><input type="checkbox" '+(r.has?'disabled ':'')+(spSel[r.i]?'checked ':'')+'aria-label="Pilih '+esc(r.nama)+'"></td>'+
        '<td>'+esc(r.kode||'—')+'</td><td><b>'+esc(r.nama)+'</b>'+(r.has?'<span class="bdg">Sudah ada</span>':'')+'</td><td>'+esc(r.guru||'—')+'</td></tr>';
    }).join('');
    spCount();
  }
  async function bukaImp(){
    spSel={};spRows=[];impMsg('');$('impQ').value='';
    $('impSub').textContent='Memuat data…';
    $('impB').innerHTML='<tr><td colspan="4" class="empty">Memuat data dari Simpedik…</td></tr>';
    spCount();imp.showModal();
    try{
      var r=await spClient().from('matapelajaran').select('*').order('nama_mapel',{ascending:true});
      if(r.error)throw r.error;
      var cur=await db.from('mata_pelajaran').select('nama_mapel,guru_pengajar');
      if(cur.error)throw cur.error;
      var have={};(cur.data||[]).forEach(function(x){have[key(x.nama_mapel,x.guru_pengajar)]=1});
      spRows=(r.data||[]).filter(function(x){return nrm(x.nama_mapel)}).map(function(x,i){
        var o={i:i,kode:nrm(x.kode_mapel),nama:nrm(x.nama_mapel),guru:nrm(x.nama_guru)};
        o.has=!!have[key(o.nama,o.guru)];return o});
      var baru=spRows.filter(function(x){return !x.has}).length;
      $('impSub').textContent=spRows.length+' mapel di Simpedik · '+baru+' belum ada di sini';
      spRender();
    }catch(e){
      $('impSub').textContent='Gagal memuat';
      $('impB').innerHTML='<tr><td colspan="4" class="empty">Gagal memuat data Simpedik: '+esc(e.message||e)+'</td></tr>';
    }
  }
  $('btnImp').addEventListener('click',bukaImp);
  $('impX').addEventListener('click',function(){imp.close()});
  $('impC').addEventListener('click',function(){imp.close()});
  imp.addEventListener('click',function(e){if(e.target===imp)imp.close()});
  $('impQ').addEventListener('input',spRender);
  $('impAll').addEventListener('change',function(){
    var on=this.checked;
    spVisible().forEach(function(r){if(r.has)return;if(on)spSel[r.i]=1;else delete spSel[r.i]});
    spRender();
  });
  $('impB').addEventListener('click',function(ev){
    var tr=ev.target.closest('tr[data-i]');if(!tr||tr.classList.contains('has'))return;
    var i=tr.getAttribute('data-i'),cb=tr.querySelector('input');
    if(ev.target!==cb)cb.checked=!cb.checked;
    if(cb.checked)spSel[i]=1;else delete spSel[i];
    spCount();
  });
  $('impGo').addEventListener('click',async function(){
    if(spBusy)return;
    var pick=spRows.filter(function(r){return spSel[r.i]&&!r.has});
    if(!pick.length)return;
    spBusy=true;spCount();$('impGo').textContent='Mengimpor…';impMsg('');
    try{
      var r0=await db.from('mata_pelajaran').select('id');
      if(r0.error)throw r0.error;
      var used={};(r0.data||[]).forEach(function(x){used[x.id]=1});
      var rows=pick.map(function(p){
        var id,t=0;do{id=acak();t++}while(used[id]&&t<500);used[id]=1;
        return {id:id,nama_mapel:p.nama,guru_pengajar:p.guru};
      });
      var r=await db.from('mata_pelajaran').insert(rows);
      if(r.error)throw r.error;
      imp.close();muat();
    }catch(e){impMsg('Gagal mengimpor: '+(e.message||e))}
    spBusy=false;spCount();
  });
  muat();muatGuru();
})();
</script>
</body>
</html>
