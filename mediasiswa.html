<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Pembelajaran — MADANI</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#0f2a1d;--muted:#58705f;--accent:#12a05f;--green:#28c840;--orange:#ff9f0a;--red:#ff453a;--purple:#af52de;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#9fe3bf 0%,#c4eed6 38%,#e6f4c8 70%,#f7e8b0 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body.lock{overflow:hidden}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sch-logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:#04150d;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.sch-logo img{width:100%;height:100%;object-fit:contain}
.sch-name{display:block;min-width:0;line-height:1.2}
.sch-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-name small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sch-name small{display:none}.sch-name b{font-size:13px}}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--track)}
.acct div{text-align:right;line-height:1.2}
.acct b{display:block;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11px;color:var(--muted)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
.wrap{max-width:none;margin:0;padding:22px min(150px,12vw)}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}
.box{padding:20px}
.box h2{font-size:18px;letter-spacing:-.01em}
.listhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select,.fld input{font:inherit;color:var(--text);padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%}
.tools select{width:auto;max-width:100%;text-overflow:ellipsis}.tools select[hidden]{display:none}
.tools select:focus,.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(18,160,95,.2)}
.fld{min-width:0}
.search{max-width:260px}

/* Kartu media */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.empty{grid-column:1/-1;padding:28px 14px;text-align:center;color:var(--muted);font-size:14px;border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.mc{display:flex;flex-direction:column;border-radius:16px;background:var(--card);box-shadow:0 0 0 .5px var(--line);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.mc:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,60,40,.2),0 0 0 .5px var(--line)}
.mc:active{transform:scale(.98)}
.thumb{position:relative;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;overflow:hidden}
.thumb .ti svg{width:40px;height:40px;opacity:.9}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.done{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;font-size:11.5px;font-weight:800;letter-spacing:.01em;color:#fff;background:linear-gradient(160deg,rgba(47,210,131,.95),rgba(11,122,71,.95))}
.mc.sdh{box-shadow:0 0 0 1.5px rgba(18,160,95,.55)}
.mb{display:flex;flex-direction:column;gap:6px;padding:12px 14px;flex:1}
.mb h3{font-size:15px;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mb p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mf{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.kls{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(18,160,95,.14);color:#0b7a47;white-space:nowrap}
.kls.mt{background:var(--track);color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
a.kls.mt{cursor:pointer}
a.kls.mt:hover{color:var(--accent);text-decoration:underline}
.sk{height:200px;border-radius:16px;background:var(--track);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* Tombol Pelajari Materi */
.learn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:700;color:#fff;
  background:linear-gradient(160deg,#2fd283,#0b7a47);box-shadow:0 4px 12px rgba(11,122,71,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.learn:hover{transform:translateY(-1px)}
.learn svg{width:17px;height:17px}
@media (max-width:640px){.learn{margin-top:5px;padding:6px 8px;font-size:11px;gap:5px;border-radius:9px}.learn svg{width:13px;height:13px}}

/* Status (belum login / error) */
.stt{padding:34px 10px;text-align:center;color:var(--muted)}
.stt b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
.stt .btn{display:inline-flex;margin-top:14px;padding:10px 20px;border-radius:12px;font-weight:700;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);box-shadow:0 4px 12px rgba(11,122,71,.35)}

/* Sticky footer dock */
.dock{position:fixed!important;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
.dock nav{pointer-events:auto;display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:10px 22px;border-radius:34px;
  background:rgba(255,255,255,.34);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,60,40,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.d{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px;padding:4px 6px;border-radius:15px;font-size:11.5px;font-weight:600;line-height:1.2;color:var(--text);transition:transform .2s}
.d:hover{transform:translateY(-6px) scale(1.1)}
.d:active{transform:scale(.94)}
.d .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.d .ic svg{width:26px;height:26px}
.d[disabled]{opacity:.55;pointer-events:none}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:min(92vw,420px);padding:11px 18px;border-radius:14px;
  font-size:13.5px;font-weight:600;color:#fff;background:#1d1d1fe6;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#0b7a47}.toast.err{background:#d12f26}

@media (max-width:640px){
  .wrap{padding:12px 5px}
  .nav{padding-left:5px;padding-right:5px}
  .acct div{display:none}.acct{padding:3px}
  .box{padding:14px}
  .box h2{font-size:15px}
  .chip{font-size:11px;padding:4px 10px}
  .dock{padding-left:5px;padding-right:5px}
  .dock nav{gap:22px;padding:8px 18px;border-radius:30px}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom));font-size:12.5px}
  /* kartu media diperkecil di smartphone */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mc{border-radius:12px}
  .mc:hover{transform:none}
  .thumb{aspect-ratio:2/1}
  .thumb .ti svg{width:22px;height:22px}
  .badge{font-size:9px;padding:1px 6px;left:5px;top:5px}
  .done{font-size:9.5px;padding:2px 6px;gap:3px}
  .mb{padding:6px 8px 5px;gap:2px}
  .mb h3{font-size:11.5px;line-height:1.25}
  .mb p{display:none}
  .mf{padding-top:2px;gap:4px}
  .kls{font-size:9.5px;padding:1px 6px}.kls.mt{display:none}
  .tools{width:100%}.tools select{flex:1;min-width:0;padding:8px 10px;font-size:14px}.tools .search{flex:1 1 100%;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="brand">
    <span class="sch-logo" id="navLogoBox" aria-hidden="true" hidden><img id="navLogo" alt=""></span>
    <span class="sch-name"><b id="navTitle">MADANI</b><small id="navSub">MGMP PAI Bangka Barat</small></span>
  </div>
  <span class="sp"></span>
  <div class="acct" aria-label="Akun masuk">
    <div><b id="acctName">Siswa</b><small id="acctRole">Siswa</small></div>
    <span class="avatar" id="acctAv">S</span>
  </div>
</header>

<main class="wrap">
  <section class="panel box" aria-labelledby="mTitle">
    <div class="listhead">
      <div>
        <h2 id="mTitle">Media Pembelajaran</h2>
        <div class="chips"><span class="chip" id="stMedia">0 media</span><span class="chip" id="stKelas">Kelas —</span></div>
      </div>
      <div class="tools" id="tools" hidden>
        <select id="fBentuk" aria-label="Filter bentuk media">
          <option value="">Semua bentuk</option><option value="pptx">PPTX</option><option value="pdf">PDF</option>
          <option value="video">Video</option><option value="pdf_video">PDF &amp; Video</option>
        </select>
        <select id="fMapel" aria-label="Filter mata pelajaran" hidden><option value="">Semua mata pelajaran</option></select>
        <div class="fld search"><input id="q" type="search" placeholder="Cari media…" aria-label="Cari media"></div>
      </div>
    </div>
    <div class="grid" id="grid">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Sticky footer -->
<div class="dock">
  <nav aria-label="Menu utama">
    <a class="d" id="btnHome" aria-label="Beranda" href="adminsiswa.html"><span class="ic" style="background:linear-gradient(160deg,#2fd283,#0b7a47)" data-i="home"></span>Beranda</a>
    <button class="d" id="bRefresh" aria-label="Refresh" type="button"><span class="ic" style="background:linear-gradient(160deg,#fb923c,#c2410c)" data-i="refresh"></span>Refresh</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  /* ---------- Konfigurasi Supabase ---------- */
  var SB_URL='https://vvlngdwghdhrrnpczier.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2bG5nZHdnaGRocnJucGN6aWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDI1MzgsImV4cCI6MjEwNzk3ODUzOH0.kV3y6rUu0NKbV451dvD4SkeZRJtuLNzwoA81tUY8jiA';
  var T_MEDIA='media';
  var db=window.supabase.createClient(SB_URL,SB_KEY);

  /* ---------- Ikon ---------- */
  var P={
    home:'<path d="M3 11l9-7.5 9 7.5M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/>',
    refresh:'<path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/>',
    book:'<path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 006.5 18H20M9 8h7"/>',
    video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
    doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/>',
    pptx:'<path d="M3 4h18M5 4v10a1 1 0 001 1h14M19 4v10a1 1 0 01-1 1M12 15v5M8.5 20h7M9 11l2-2 2 1.5 2.5-3"/>',
    pdfvideo:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h4M14 3v5h5M19 8v3"/><circle cx="16.5" cy="17" r="4.5"/><path d="M15.5 15.2v3.6l3-1.8z"/>'
  };
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';}
  document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=svg(e.dataset.i);});

  var BENTUK={pptx:'PPTX',pdf:'PDF',video:'Video',pdf_video:'PDF & Video'};
  var ICON={pptx:'pptx',pdf:'doc',video:'video',pdf_video:'pdfvideo'};
  var GRAD={
    pptx:'linear-gradient(160deg,#fb923c,#c2410c)',pdf:'linear-gradient(160deg,#f87171,#b91c1c)',
    video:'linear-gradient(160deg,#a78bfa,#6d28d9)',pdf_video:'linear-gradient(160deg,#2dd4bf,#0f766e)'
  };

  /* ---------- Util ---------- */
  var $=function(id){return document.getElementById(id);};
  var rows=[],materiRows=[],me=null,kelas='',tt;
  function toast(t,k){var e=$('toast');e.textContent=t;e.className='toast show '+(k||'');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show');},3400);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function isUrl(s){try{var u=new URL(s);return u.protocol==='http:'||u.protocol==='https:';}catch(_){return false;}}
  function nk(s){return String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();}
  function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase()||'S';}
  function stateBox(title,msg,btn){
    $('tools').hidden=true;
    $('grid').innerHTML='<div class="empty"><div class="stt"><b>'+esc(title)+'</b>'+esc(msg)+(btn?'<br><a class="btn" href="index.html">'+esc(btn)+'</a>':'')+'</div></div>';
  }

  /* ---------- Siswa yang login (disimpan index.html saat login Ruang Siswa) ---------- */
  var sess=null;
  try{sess=JSON.parse(sessionStorage.getItem('madani_session')||'null');}catch(_){}
  if(!sess||sess.role!=='siswa'||!sess.id){
    stateBox('Belum login sebagai siswa','Silakan masuk lewat Ruang Siswa untuk melihat media pembelajaran.','Ke halaman login');
    $('bRefresh').disabled=true;
    return;
  }
  kelas=sess.kelas||'';
  $('acctName').textContent=sess.nama||'Siswa';
  $('acctRole').textContent=kelas||'Siswa';
  $('acctAv').textContent=initials(sess.nama);
  $('stKelas').textContent=kelas?('Kelas '+kelas):'Kelas —';

  /* ---------- Sampul dari YouTube ---------- */
  function ytId(u){var m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:null;}
  function thumbUrl(m){var id=ytId(m.link_video||'');return id?'https://img.youtube.com/vi/'+id+'/hqdefault.jpg':null;}

  /* ---------- Kartu media ---------- */
  function materiLink(m){
    if(!m.bahan_ajar)return '';
    var f=materiRows.filter(function(x){return x.nama_bahan_ajar===m.bahan_ajar&&isUrl(x.link_buku);});
    var k=f.filter(function(x){return nk(x.kelas)===nk(m.kelas);})[0]||f[0];
    return k?k.link_buku:'';
  }
  var studied={};
  function cardHtml(m){
    var b=BENTUK[m.bentuk]?m.bentuk:'pdf',img=thumbUrl(m),ml=materiLink(m);
    return '<div class="mc'+(studied[m.id]?' sdh':'')+'" role="button" tabindex="0" data-id="'+m.id+'" aria-label="Buka media '+esc(m.judul)+'">'+
      '<div class="thumb" style="background:'+GRAD[b]+'"><span class="ti">'+svg(ICON[b])+'</span>'+
        (img?'<img loading="lazy" alt="" src="'+esc(img)+'" referrerpolicy="no-referrer">':'')+
        '<span class="badge">'+esc(BENTUK[b])+'</span>'+(studied[m.id]?'<span class="done">&#10003; Sudah Dipelajari</span>':'')+'</div>'+
      '<div class="mb"><h3>'+esc(m.judul)+'</h3>'+(m.deskripsi?'<p>'+esc(m.deskripsi)+'</p>':'')+
        '<div class="mf"><span class="kls">'+esc(m.kelas)+'</span>'+
        (m.bahan_ajar?(ml?'<a class="kls mt" href="'+esc(ml)+'" target="_blank" rel="noopener noreferrer" title="Buka materi \''+esc(m.bahan_ajar)+'\' di tab baru">'+esc(m.bahan_ajar)+'</a>':'<span class="kls mt" title="'+esc(m.bahan_ajar)+'">'+esc(m.bahan_ajar)+'</span>'):'')+
        '</div>'+
        '<a class="learn" href="belajar.html?id='+m.id+'">'+svg('book')+'Pelajari Materi</a>'+
        '</div></div>';
  }
  /* mata pelajaran: kolom di tabel media (mata_pelajaran / matapelajaran / mapel);
     bila kosong, dipakai mata pelajaran dari materi terkait (tabel materi) */
  function pickKey(o){var k='';Object.keys(o||{}).forEach(function(x){if(!k&&/^(mata_?pelajaran|mapel)$/i.test(x))k=x;});return k;}
  function mapelOf(m){
    var k=pickKey(m),v=k?String(m[k]||'').trim():'';
    if(v||!m.bahan_ajar)return v;
    var f=materiRows.filter(function(x){return x.nama_bahan_ajar===m.bahan_ajar;});
    var t=f.filter(function(x){return nk(x.kelas)===nk(m.kelas);})[0]||f[0];
    if(!t)return '';
    var tk=pickKey(t);return tk?String(t[tk]||'').trim():'';
  }
  function fillMapel(){
    var sel=$('fMapel'),cur=sel.value,ms=[];
    rows.forEach(function(r){var m=mapelOf(r);if(m&&ms.indexOf(m)<0)ms.push(m);});
    ms.sort(function(a,b){return a.localeCompare(b,'id',{numeric:true});});
    sel.hidden=!ms.length;
    sel.innerHTML='<option value="">Semua mata pelajaran</option>'+ms.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
    sel.value=ms.indexOf(cur)>-1?cur:'';
  }
  function render(){
    var q=$('q').value.trim().toLowerCase(),fb=$('fBentuk').value,fm=$('fMapel').value;
    var list=rows.filter(function(r){
      return (!fb||r.bentuk===fb)&&(!fm||mapelOf(r)===fm)&&
        (!q||(r.judul||'').toLowerCase().indexOf(q)>-1||(r.deskripsi||'').toLowerCase().indexOf(q)>-1||(r.bahan_ajar||'').toLowerCase().indexOf(q)>-1||mapelOf(r).toLowerCase().indexOf(q)>-1);
    });
    $('grid').innerHTML=list.length?list.map(cardHtml).join(''):
      '<div class="empty">'+(rows.length?'Tidak ada media yang cocok.':'Belum ada media pembelajaran untuk kelas '+esc(kelas||'-')+'.')+'</div>';
    $('stMedia').textContent=rows.length+' media';
  }
  /* gambar sampul yang gagal dimuat -> tampilkan ikon */
  $('grid').addEventListener('error',function(ev){if(ev.target&&ev.target.tagName==='IMG')ev.target.remove();},true);
  $('q').addEventListener('input',render);
  $('fBentuk').addEventListener('change',render);
  $('fMapel').addEventListener('change',render);

  $('grid').addEventListener('click',function(ev){
    if(ev.target.closest('a'))return; /* tombol Pelajari Materi & materi terkait memakai link bawaan */
    var c=ev.target.closest('.mc');if(c)openMedia(+c.dataset.id);
  });
  $('grid').addEventListener('keydown',function(ev){
    if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList.contains('mc')){ev.preventDefault();openMedia(+ev.target.dataset.id);}
  });

  /* ---------- Data: kelas siswa (tabel siswa), media (tabel media), materi (tabel materi) ---------- */
  async function loadMe(){
    try{
      var r=await db.from('siswa').select('id,nama,rombel,photo').eq('id',sess.id).maybeSingle();
      if(r.error||!r.data)return;
      me=r.data;
      if(me.rombel)kelas=me.rombel;
      $('acctName').textContent=me.nama||sess.nama||'Siswa';
      $('acctRole').textContent=kelas||'Siswa';
      $('stKelas').textContent=kelas?('Kelas '+kelas):'Kelas —';
      if(me.photo)$('acctAv').innerHTML='<img alt="" src="'+esc(me.photo)+'">';
      else $('acctAv').textContent=initials(me.nama);
    }catch(_){}
  }
  async function loadMateri(){
    try{
      var r=await db.from('materi').select('*');
      materiRows=r.error?[]:(r.data||[]);
    }catch(_){materiRows=[];}
  }
  async function loadStudied(){
    var map={},from=0,step=1000;
    try{
      for(;;){
        var rs=await db.from('catatan_siswa').select('media_id').eq('siswa_id',sess.id).range(from,from+step-1);
        if(rs.error)throw rs.error;
        (rs.data||[]).forEach(function(x){if(x.media_id!=null)map[x.media_id]=1;});
        if(!rs.data||rs.data.length<step)break;
        from+=step;
      }
      studied=map;
    }catch(e){if(window.console)console.warn('Gagal memuat status Sudah Dipelajari:',e);}
  }
  async function load(){
    try{
      var r=await db.from(T_MEDIA).select('*').order('created_at',{ascending:false});
      if(r.error)throw r.error;
      /* hanya media untuk kelas siswa ini (perbandingan tidak peka huruf besar/kecil & spasi) */
      rows=(r.data||[]).filter(function(m){return kelas&&nk(m.kelas)===nk(kelas);});
      /* "Sudah Dipelajari": ada data catatan siswa ini untuk media tersebut di tabel catatan_siswa */
      await loadStudied();
      fillMapel();
      $('tools').hidden=false;
      render();
      return true;
    }catch(e){
      rows=[];
      stateBox('Gagal memuat media',(e&&e.message)||String(e));
      toast('Gagal memuat: '+((e&&e.message)||e),'err');
      return false;
    }
  }

  function refreshStudied(){if(!rows.length)return;loadStudied().then(render);}
  window.addEventListener('pageshow',function(e){if(e.persisted)refreshStudied();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshStudied();});

  /* ---------- Buka halaman belajar ---------- */
  function openMedia(id){location.href='belajar.html?id='+encodeURIComponent(id);}

  $('bRefresh').addEventListener('click',async function(){
    var b=this;b.disabled=true;
    await Promise.all([loadMe(),loadMateri()]);
    var ok=await load();
    b.disabled=false;
    if(ok)toast('Media terbaru ditampilkan.','ok');
  });

  /* ---------- Navbar: nama & logo sekolah dari tabel profil ---------- */
  (async function(){
    try{
      var r=await db.from('profil').select('nama_sekolah,logo_url').order('id',{ascending:true}).limit(1).maybeSingle();
      if(r.error||!r.data)return;
      if(r.data.nama_sekolah)$('navTitle').textContent=r.data.nama_sekolah;
      if(r.data.logo_url){$('navLogo').src=r.data.logo_url;$('navLogoBox').hidden=false;}
    }catch(_){}
  })();

  (async function(){
    await Promise.all([loadMe(),loadMateri()]); /* kelas dari tabel siswa dulu, baru saring media */
    load();
  })();
})();
</script>
</body>
</html>
