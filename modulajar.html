<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#0f2233;--muted:#4d6a80;--accent:#3d9be0;--green:#28c840;--orange:#ff9f0a;--red:#ff453a;--purple:#af52de;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#97D7FF 0%,#c3e6ff 38%,#e3f3ff 70%,#fdf1d0 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sch-logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:#08141d;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.sch-logo svg{width:20px;height:20px}
.sch-logo img{width:100%;height:100%;object-fit:contain}
.sch-name{display:block;min-width:0;line-height:1.2}
.sch-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-name small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sch-name small{display:none}.sch-name b{font-size:13px}}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--track)}
.acct div{text-align:right;line-height:1.2}
.acct b{display:block;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11px;color:var(--muted)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(160deg,#b9e5ff,#6fc2f6);color:#0b2a42;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
.wrap{max-width:none;margin:0;padding:22px min(150px,12vw)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.025em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}



.box{padding:20px}
.box h2{font-size:18px;letter-spacing:-.01em}
.box .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}


/* Sticky footer dock — gaya dock layar utama ponsel (melayang, kaca buram, ikon squircle) */
.dock{position:fixed!important;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
html,body{overflow-x:hidden}
.dock nav{pointer-events:auto;width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-around;gap:8px;padding:10px 14px;border-radius:34px;
  background:rgba(255,255,255,.34);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,60,100,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.d{flex:0 0 auto;display:grid;place-items:center;padding:0;border-radius:15px;font-size:0;line-height:0;transition:transform .2s}
.d:hover{transform:translateY(-6px) scale(1.1)}
.d:active{transform:scale(.94)}
.d .ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.d .ic svg{width:28px;height:28px}
.d{position:relative}
/* Tooltip nama menu (teks putih, latar hitam) */
.d[data-tip]::after,.d[data-tip]::before{position:absolute;left:50%;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s}
.d[data-tip]::after{content:attr(data-tip);bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:6px 11px;border-radius:8px;background:#000;color:#fff;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.d[data-tip]::before{content:"";bottom:calc(100% + 7px);transform:translate(-50%,4px);border-style:solid;border-width:5px 5px 0;border-color:#000 transparent transparent}
.d[data-tip]:focus-visible::after,.d[data-tip]:focus-visible::before{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media (hover:hover){.d[data-tip]:hover::after,.d[data-tip]:hover::before{opacity:1;visibility:visible;transform:translate(-50%,0)}}
@media (max-width:520px){.dock nav{padding:9px 12px;border-radius:30px}.d .ic{width:50px;height:50px;border-radius:14px}.d .ic svg{width:25px;height:25px}}


@media (max-width:520px){.acct div{display:none}.acct{padding:3px}.wrap{padding:16px 5px}.nav{padding-left:5px;padding-right:5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ===== Halaman Profil ===== */
.uploads{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.uploads{grid-template-columns:1fr}}
.up-card{padding:16px;text-align:center;border-radius:16px;background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.up-card h3{font-size:14px;margin-bottom:12px;text-align:left}
.pv{position:relative;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;background:var(--track);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pv.foto{width:150px;height:200px;border-radius:16px}
.pv.logo{width:150px;height:150px;border-radius:20px}
.pv img{width:100%;height:100%;object-fit:cover;display:none}
.pv.logo img{object-fit:contain;padding:8px;background:#fff}
.pv.has img{display:block}
.pv.has .ph{display:none}
.pv .ph{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pv .ph svg{width:34px;height:34px;opacity:.7}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld label em{color:var(--red);font-style:normal}
.fld input,.fld select,.fld textarea{font:inherit;color:var(--text);width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  transition:border-color .15s,box-shadow .15s}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,166,230,.2)}
.fld input[readonly]{background:var(--track);color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.pw{position:relative}.pw input{padding-right:46px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}.pw button:hover{background:var(--track)}.pw button svg{width:18px;height:18px}
.sec{grid-column:1/-1;font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--accent);padding-top:6px;border-top:.5px solid var(--line);margin-top:4px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;transition:transform .15s,box-shadow .15s,opacity .15s}
.btn svg{width:18px;height:18px}
.btn.pri{color:#fff;background:linear-gradient(160deg,#b9e5ff,#6fc2f6);color:#0b2a42;box-shadow:0 4px 12px rgba(74,166,230,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.sec2{background:var(--track)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.55;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;grid-column:1/-1}
.state{font-size:13px;font-weight:600;color:var(--muted)}
.state.new{color:#b7860b}.state.edit{color:#0d9488}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:min(92vw,420px);padding:11px 18px;border-radius:14px;
  font-size:13.5px;font-weight:600;color:#fff;background:#1d1d1fe6;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#2c7fb8}.toast.err{background:#d12f26}
.skel{opacity:.55;pointer-events:none}
.d[disabled]{opacity:.55;pointer-events:none}

/* ===== Ukuran ringkas untuk smartphone ===== */
@media (max-width:640px){
  .wrap{padding:12px 10px}
  .head{margin-bottom:12px}
  h1{font-size:22px}
  .head p{font-size:12px}
  .chip{font-size:11px;padding:4px 10px}
  .box{padding:14px}
  .box h2{font-size:15px}
  .box .sub{font-size:11.5px;margin-bottom:10px}
  .form{gap:10px 12px}
  .sec{font-size:11.5px}
  .fld{gap:4px}
  .fld label{font-size:11.5px}
  .fld input,.fld select,.fld textarea{font-size:14px;padding:8px 10px;border-radius:10px}
  .fld textarea{min-height:64px}
  .pw input{padding-right:40px}
  .pw button{width:28px;height:28px}.pw button svg{width:16px;height:16px}
  .uploads{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .up-card{padding:10px;border-radius:12px}
  .up-card h3{font-size:12px;margin-bottom:8px}
  .pv.foto{width:84px;height:112px;border-radius:12px}
  .pv.logo{width:84px;height:84px;border-radius:14px}
  .pv{margin-bottom:8px}
  .pv .ph{font-size:10px}.pv .ph svg{width:24px;height:24px}
  .btn.sm{padding:6px 10px;font-size:11.5px}.btn svg{width:15px;height:15px}
  .hint{font-size:10.5px;margin-top:6px}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom));font-size:12.5px}
}

/* ===== Halaman Rombel ===== */
.stats{display:flex;flex-wrap:wrap;gap:8px}
.tbl-wrap{overflow-x:auto;border-radius:14px;box-shadow:0 0 0 .5px var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--muted);background:var(--track)}
td{border-top:.5px solid var(--line)}
tr.sel td{background:rgba(74,166,230,.1)}
td.num,th.num{text-align:right}
td.act,th.act{text-align:right;width:1%}
.ib{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--track);color:var(--text)}
.ib.del:hover{background:rgba(255,69,58,.14);color:var(--red)}
.ib svg{width:18px;height:18px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px}
.gap{height:16px}
.search{max-width:260px}
.listhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
@media (max-width:640px){
  th,td{padding:8px 10px;font-size:12.5px}
  .ib{width:30px;height:30px}.ib svg{width:16px;height:16px}
  .search{max-width:none;width:100%}
}


/* ===== Halaman Modul Ajar ===== */
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);max-width:220px}
.lnk:hover{text-decoration:underline}
.lnk svg{flex:none;width:15px;height:15px}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kls{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(151,215,255,.3);color:#1f6fa8}
.listhead .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.listhead .tools select{font:inherit;color:var(--text);padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.listhead .tools select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,166,230,.2)}
.dock nav{max-width:360px}
@media (max-width:640px){
  .lnk{max-width:130px}
  .listhead .tools{width:100%}.listhead .tools select{padding:8px 10px;font-size:14px;flex:1}
  .listhead .tools .search{flex:2}
}

/* ===== Transisi buka/tutup halaman (halus, gaya macOS: muncul dari tombol) ===== */
@view-transition{navigation:auto}
.nav{view-transition-name:pt-nav}
.dock nav{view-transition-name:pt-dock}
::view-transition-group(*){animation-duration:.32s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(root){animation:ptOut .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:ptIn .36s cubic-bezier(.22,1,.36,1) both}
@keyframes ptOut{to{opacity:0;transform:scale(.985)}}
@keyframes ptIn{from{opacity:0;transform:translateY(14px) scale(.992)}}
/* cadangan untuk peramban tanpa View Transitions lintas-halaman */
@keyframes ptFade{from{opacity:0}}
@keyframes ptRise{from{opacity:0;transform:translateY(12px)}}
@keyframes ptZoom{from{opacity:0;transform:scale(.12)}}
.pt-fb body{animation:ptFade .3s ease both}
.pt-fb .wrap{animation:ptRise .38s cubic-bezier(.22,1,.36,1) backwards}
.pt-fb.pt-out body{opacity:0;transition:opacity .2s ease}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .pt-fb body,.pt-fb .wrap{animation:none!important}
  .pt-fb.pt-out body{transition:none}
}

<script>
/* Transisi halaman: halaman baru "keluar" dari tombol yang diklik (seperti membuka jendela dari Dock macOS);
   tombol Beranda menutupnya kembali mengecil ke tombol. Cadangan fade untuk peramban tanpa View Transitions. */
(function(){
  var KEY='pt-origin',h=document.documentElement,
      reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,
      vt=typeof PageRevealEvent!=='undefined';
  function take(){
    var o=null;
    try{o=JSON.parse(sessionStorage.getItem(KEY)||'null');sessionStorage.removeItem(KEY);}catch(_){}
    return o&&Date.now()-o.t<5000?o:null;
  }
  if(!vt)h.classList.add('pt-fb');

  /* simpan titik asal (pusat ikon yang diklik) lalu, bila perlu, jalankan fade-out cadangan */
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||(a.target&&a.target!=='_self')||a.hasAttribute('download'))return;
    var u;try{u=new URL(a.href,location.href);}catch(_){return;}
    if(u.origin!==location.origin||(u.pathname===location.pathname&&u.search===location.search))return;
    var el=a.querySelector('.ic,.ai')||a,r=el.getBoundingClientRect();
    try{sessionStorage.setItem(KEY,JSON.stringify({x:r.left+r.width/2,y:r.top+r.height/2,close:a.id==='btnHome',t:Date.now()}));}catch(_){}
    if(vt||reduce)return;
    e.preventDefault();h.classList.add('pt-out');
    setTimeout(function(){location.href=u.href;},200);
  });
  window.addEventListener('pageshow',function(e){if(e.persisted)h.classList.remove('pt-out');});

  if(vt){
    addEventListener('pagereveal',function(e){
      var o=take();
      if(!o||!e.viewTransition||reduce)return;
      e.viewTransition.ready.then(function(){
        var org=o.x+'px '+o.y+'px',nb={mixBlendMode:'normal'},
            opt=function(pe,d){return {pseudoElement:pe,duration:d,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'};};
        function kf(a,b){return [Object.assign({},nb,a),Object.assign({},nb,b)];}
        if(o.close){      /* tutup: halaman lama mengecil ke tombol, halaman tujuan terlihat di belakangnya */
          h.animate(kf({transform:'scale(1)',opacity:1,zIndex:3,transformOrigin:org},
                       {transform:'scale(.06)',opacity:0,zIndex:3,transformOrigin:org}),opt('::view-transition-old(root)',400));
          h.animate(kf({transform:'scale(1.04)',opacity:.55},{transform:'scale(1)',opacity:1}),opt('::view-transition-new(root)',400));
        }else{            /* buka: halaman baru membesar dari tombol, halaman lama sedikit mundur */
          h.animate(kf({transform:'scale(.05)',opacity:0,borderRadius:'48px',zIndex:3,transformOrigin:org},
                       {transform:'scale(1)',opacity:1,borderRadius:'0px',zIndex:3,transformOrigin:org}),opt('::view-transition-new(root)',480));
          h.animate(kf({transform:'scale(1)',opacity:1},{transform:'scale(.96)',opacity:1}),opt('::view-transition-old(root)',480));
        }
      }).catch(function(){});
    });
  }else{
    /* cadangan: lembar isi membesar dari titik tombol */
    document.addEventListener('DOMContentLoaded',function(){
      var o=take(),w=document.querySelector('.wrap');
      if(!o||o.close||reduce||!w)return;
      var r=w.getBoundingClientRect();
      w.style.transformOrigin=(o.x-r.left)+'px '+(o.y-r.top)+'px';
      w.style.animation='ptZoom .46s cubic-bezier(.22,1,.36,1) backwards';
    });
  }
})();
</script>

    }catch(e){
      kelasRombel=[];
      toast('Gagal memuat daftar kelas dari Rombel: '+(e.message||e),'err');
    }
    fillKelas($('kelas').value);
  }
  function fillKelas(cur){
    var sel=$('kelas'),names=kelasRombel.slice();
    /* data lama yang kelasnya sudah tidak ada di rombel tetap ditampilkan agar tidak hilang */
    if(cur&&names.indexOf(cur)<0)names.push(cur);
    sel.innerHTML='<option value="">'+(names.length?'— Pilih kelas —':'Belum ada data di halaman Rombel')+'</option>'+
      names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
    sel.value=cur||'';
  }

  /* ---------- Dropdown Mata Pelajaran: ditarik dari tabel mata_pelajaran (halaman matapelajaran.html) ---------- */
  /* Hanya mata pelajaran yang diajarkan guru yang login (kolom guru_pengajar di tabel mata_pelajaran).
     Nama guru = akun yang tampil di navbar (sama dengan adminguru.html). */
  var guruNow='';
  function normNm(x){return String(x||'').trim().replace(/\s+/g,' ').toLowerCase();}
  async function getGuru(){
    if(guruNow)return guruNow;
    var n='';
    /* sesi login (index.html) adalah sumber utama; madani_acct hanya cadangan */
    try{var ss=JSON.parse(sessionStorage.getItem('madani_session')||'null');if(ss&&ss.nama)n=ss.nama;}catch(_){}
    if(!n){try{var ac=JSON.parse(sessionStorage.getItem('madani_acct')||'null');if(ac&&ac.nama)n=ac.nama;}catch(_){}}
    if(!n){
      try{
        var rp=await db.from('profil').select('nama_guru').order('id',{ascending:true}).limit(1).maybeSingle();
        if(!rp.error&&rp.data&&rp.data.nama_guru)n=rp.data.nama_guru;
      }catch(_){}
    }
    guruNow=String(n||'').trim().replace(/\s+/g,' ');
    return guruNow;
  }
  /* mapel guru ini (tabel mata_pelajaran, kolom guru_pengajar = nama guru) dimuat sekali; data lain disaring dengannya */
  var mapelP=null;
  function ensureMapel(){return mapelP||(mapelP=loadMapel());}
  function mine(n){var k=normNm(n);return !!k&&mapelList.some(function(m){return normNm(m)===k;});}
  async function loadMapel(){
    try{
      var g=await getGuru(),gk=normNm(g);
      var r=await db.from('mata_pelajaran').select('nama_mapel,guru_pengajar').order('nama_mapel',{ascending:true});
      if(r.error)throw r.error;
      var seen={};
      mapelList=(r.data||[]).filter(function(x){return gk&&normNm(x.guru_pengajar)===gk;})
        .map(function(x){return (x.nama_mapel||'').trim().replace(/\s+/g,' ');})
        .filter(function(n){if(!n||seen[n])return false;seen[n]=1;return true;})
        .sort(function(a,b){return a.localeCompare(b,'id',{numeric:true});});
    }catch(e){
      mapelList=[];
      toast('Gagal memuat mata pelajaran: '+(e.message||e),'err');
    }
    fillMapel($('mapel').value);
  }
  function fillMapel(cur){
    var sel=$('mapel'),names=mapelList.slice();
    /* data lama yang mapelnya sudah tidak ada di daftar tetap ditampilkan agar tidak hilang */
    if(cur&&names.indexOf(cur)<0)names.push(cur);
    sel.innerHTML='<option value="">'+(names.length?'— Pilih mata pelajaran —':(guruNow?'Belum ada mata pelajaran yang Anda ajar':'Guru yang login tidak dikenali'))+'</option>'+
      names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
    sel.value=cur||'';
  }

  /* ---------- Form ---------- */
  function resetForm(){
    editId=null;
    $('id').value='Otomatis';fillKelas('');fillMapel('');$('nama').value='';$('link').value='';
    $('formTitle').textContent='Tambah Modul Ajar';
    $('bSaveTxt').textContent='Simpan';
    render();
  }
  function startEdit(id){
    var r=rows.find(function(x){return x.id===id;});if(!r)return;
    editId=id;
    $('id').value=r.id;fillKelas(r.kelas||'');fillMapel(r.matapelajaran||'');$('nama').value=r.nama_modul_ajar||'';$('link').value=r.link_modul||'';
    $('formTitle').textContent='Ubah Modul Ajar';
    $('bSaveTxt').textContent='Perbarui';
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    $('nama').focus();
  }

  /* ---------- Tabel ---------- */
  function fillFilter(){
    var sel=$('fKelas'),cur=sel.value;
    var ks=[];rows.forEach(function(r){if(r.kelas&&ks.indexOf(r.kelas)<0)ks.push(r.kelas);});
    ks.sort(function(a,b){return a.localeCompare(b,'id',{numeric:true});});
    sel.innerHTML='<option value="">Semua kelas</option>'+ks.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+'</option>';}).join('');
    sel.value=ks.indexOf(cur)>-1?cur:'';
    return ks.length;
  }
  function render(){
    var q=$('q').value.trim().toLowerCase(),fk=$('fKelas').value;
    var list=rows.filter(function(r){
      return (!fk||r.kelas===fk)&&(!q||(r.nama_modul_ajar||'').toLowerCase().indexOf(q)>-1||(r.matapelajaran||'').toLowerCase().indexOf(q)>-1||(r.kelas||'').toLowerCase().indexOf(q)>-1);
    });
    var tb=$('tb');
    if(!list.length){tb.innerHTML='<tr><td colspan="6" class="empty">'+(rows.length?'Tidak ada modul ajar yang cocok.':'Belum ada modul ajar. Isi formulir di atas untuk menambahkan.')+'</td></tr>';}
    else{
      tb.innerHTML=list.map(function(r){
        var href=isUrl(r.link_modul)?esc(r.link_modul):'#';
        return '<tr class="'+(r.id===editId?'sel':'')+'"><td>'+r.id+'</td><td><b>'+esc(r.nama_modul_ajar)+'</b></td>'+
          '<td>'+esc(r.matapelajaran||'-')+'</td>'+
          '<td><span class="kls">'+esc(r.kelas)+'</span></td>'+
          '<td><a class="lnk" href="'+href+'" target="_blank" rel="noopener noreferrer" title="'+esc(r.link_modul)+'">'+svg('ext')+'<span>Buka modul</span></a></td>'+
          '<td class="act"><button type="button" class="ib" data-act="edit" data-id="'+r.id+'" aria-label="Ubah '+esc(r.nama_modul_ajar)+'">'+svg('edit')+'</button>'+
          '<button type="button" class="ib del" data-act="del" data-id="'+r.id+'" aria-label="Hapus '+esc(r.nama_modul_ajar)+'">'+svg('trash')+'</button></td></tr>';
      }).join('');
    }
    $('stBuku').textContent=rows.length+' modul ajar';
  }

  /* ---------- Muat data ---------- */
  async function load(){
    setBusy(true);
    try{
      var r=await db.from(TABLE).select('*').order('kelas',{ascending:true}).order('nama_modul_ajar',{ascending:true});
      if(r.error)throw r.error;
      await ensureMapel();
      rows=(r.data||[]).filter(function(x){return mine(x.matapelajaran);});   /* hanya mapel milik guru yang login */
      $('stKelas').textContent=fillFilter()+' kelas';
      if(editId!==null&&!rows.some(function(x){return x.id===editId;}))resetForm();
      render();
      setBusy(false);return true;
    }catch(e){
      rows=[];render();
      $('tb').innerHTML='<tr><td colspan="6" class="empty">Gagal memuat data. Pastikan tabel "modulajar" sudah dibuat di Supabase.</td></tr>';
      toast('Gagal memuat: '+(e.message||e),'err');
      setBusy(false);return false;
    }
  }

  /* ---------- Simpan ---------- */
  $('frm').addEventListener('submit',async function(ev){
    ev.preventDefault();if(busy)return;
    var nama=$('nama').value.trim().replace(/\s+/g,' ');
    var kelas=$('kelas').value.trim().replace(/\s+/g,' ');
    var mapel=$('mapel').value.trim().replace(/\s+/g,' ');
    var link=$('link').value.trim();
    if(!nama){toast('Nama Modul Ajar wajib diisi.','err');$('nama').focus();return;}
    if(!kelas){toast('Kelas wajib dipilih.','err');$('kelas').focus();return;}
    if(!mapel){toast('Mata Pelajaran wajib dipilih.','err');$('mapel').focus();return;}
    if(!link){toast('Link Modul wajib diisi.','err');$('link').focus();return;}
    if(!isUrl(link)){toast('Link Modul harus diawali http:// atau https://','err');$('link').focus();return;}
    var row={nama_modul_ajar:nama,matapelajaran:mapel,kelas:kelas,link_modul:link};
    setBusy(true);$('bSaveTxt').textContent='Menyimpan…';
    try{
      var res;
      if(editId!==null){
        row.updated_at=new Date().toISOString();
        res=await db.from(TABLE).update(row).eq('id',editId).select().single();
      }else{
        res=await db.from(TABLE).insert(row).select().single();
      }
      if(res.error)throw res.error;
      var wasEdit=editId!==null;
      await load();
      resetForm();
      toast(wasEdit?'Data berhasil diperbarui.':'Data berhasil ditambahkan.','ok');
    }catch(e){
      toast('Gagal menyimpan: '+(e.message||e),'err');
      $('bSaveTxt').textContent=editId!==null?'Perbarui':'Simpan';
    }
    setBusy(false);
  });

  /* ---------- Aksi tabel ---------- */
  $('tb').addEventListener('click',async function(ev){
    var b=ev.target.closest('button[data-act]');if(!b||busy)return;
    var id=+b.dataset.id;
    if(b.dataset.act==='edit'){startEdit(id);return;}
    var r=rows.find(function(x){return x.id===id;});if(!r)return;
    if(!confirm('Hapus modul ajar "'+r.nama_modul_ajar+'"?'))return;
    setBusy(true);
    try{
      var d=await db.from(TABLE).delete().eq('id',id);
      if(d.error)throw d.error;
      if(editId===id)resetForm();
      await load();
      toast('Data berhasil dihapus.','ok');
    }catch(e){toast('Gagal menghapus: '+(e.message||e),'err');}
    setBusy(false);
  });

  $('q').addEventListener('input',render);
  $('fKelas').addEventListener('change',render);
  $('bNew').addEventListener('click',function(){resetForm();$('nama').focus();});
  $('bRefresh').addEventListener('click',function(){Promise.all([(mapelP=loadMapel()),load(),loadKelas()]).then(function(a){if(a[1])toast('Data terbaru ditampilkan.','ok');});});

  /* ---------- Akun guru: ikut yang tampil di adminguru.html ---------- */
  var acctLocked=false;
  try{
    var ac=JSON.parse(sessionStorage.getItem('madani_acct')||'null');
    if(ac&&ac.nama){
      acctLocked=true;
      $('acctName').textContent=ac.nama;
      if(ac.foto){$('acctAv').innerHTML='<img alt="" src="'+esc(ac.foto)+'">';}
      else{$('acctAv').textContent=ac.nama.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();}
    }
  }catch(_){}
  try{
    var sesi=JSON.parse(sessionStorage.getItem('madani_session')||'null');
    if(!acctLocked&&sesi&&sesi.nama){
      $('acctName').textContent=sesi.nama;
      $('acctAv').textContent=sesi.nama.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
    }
  }catch(_){}
  paintNav();
  loadKelas();
  ensureMapel();
  load();
})();
</script>
</body>
</html>
